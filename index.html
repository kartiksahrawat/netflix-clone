<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix-Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="./Assets/logo.svg" alt="Logo" width="150px">
            </div>
            <div class="btns">
                <button class="lan-btn">
                    English
                    <i id="dwnarr">▼</i>
                </button>
                <!-- <button class="sign-btn">Sign In</button> -->
                 <a href="https://www.netflix.com/in/login?serverState=Bgi8vuvcAxK1AUFv%2BBMzYqpFrFqjpgEw5d16kdwtNk%2F6P8aGYcwVoxirFZsDD1JwauCGLTmPBcE0zHyfoPjOhOUlL8Q%2FW4tn%2BWnDS2uVabuzyVoa%2FzoEskZ8D88tT%2Fckrs1ivjdHL%2Fi23h4PT4kEpIvNcSIXs7Ym29k%2BJfqMuvf5pM1sHzObYj1dzUl1B1zz5fg%2BNCkDHhcCcyvbd3lkIY0ZuctuQRu5GwJKY0FFrKjWriWmg8PvQsULPL6iaxYYBiIOCgy0g19Q5OIGKxbb2wY%3D" target="_blank" class="sign-btn">Sign In</a>
            </div>
        </div>  <!-- ye wala div tag navbar ka closing tag hai -->
        
        <div class="hero-content">
            <!-- Text Part -->
            <h1>Unlimited movies, shows, and more</h1>
            <p class="subtitle">Starts at ₹149. Cancel at any time.</p>
            <p class="cta-text">Ready to watch? Enter your email to create or restart your membership.</p>

            <!-- Input + Button Part -->
            <form class="email-form">
                <input type="email" placeholder="Email address" required>
                <button type="submit">Get Started
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </div> <!-- ye wala div tag hero-content ka closing tag hai -->
    </header> <!-- ye wala div tag header ka closing tag hai -->

    <!-- Curved Glowing Horizon Divider -->
    <div class="curve-container">
        <div class="curve-arc"></div>
    </div>

    <!-- Trending Now Section -->
<section class="trending-section">
  <h2>Trending Now</h2>

  <div class="carousel-wrapper">
    <!-- Left Button -->
    <button class="carousel-btn prev-btn" id="prevBtn">&#10094;</button>

    <!-- Cards Container -->
    <div class="cards-track" id="cardsTrack">
      <div class="card">
        <img src="./Assets/1dhamal.png" alt="Dhamaal 4" />
        <span class="card-num">1</span>
      </div>
      <div class="card">
        <img src="./Assets/2alpha.png" alt="Alpha" />
        <span class="card-num">2</span>
      </div>
      <div class="card">
        <img src="./Assets/3sagar.png" alt="Safed Sagar" />
        <span class="card-num">3</span>
      </div>
      <div class="card">
        <img src="./Assets/4gand.png" alt="Andhari" />
        <span class="card-num">4</span>
      </div>
      <div class="card">
        <img src="./Assets/5cock.png" alt="Cocktail 2" />
        <span class="card-num">5</span>
      </div>
      <div class="card">
        <img src="./Assets/6kusti.png" alt="Show 6" />
        <span class="card-num">6</span>
      </div>
      <div class="card">
        <img src="./Assets/7cafe.png" alt="Show 7" />
        <span class="card-num">7</span>
      </div>
      <div class="card">
        <img src="./Assets/8korean.png" alt="Show 8" />
        <span class="card-num">8</span>
      </div>
      <div class="card">
        <img src="./Assets/9peedi.png" alt="Show 9" />
        <span class="card-num">9</span>
      </div>
      <div class="card">
        <img src="./Assets/10sex.png" alt="Show 10" />
        <span class="card-num">10</span>
      </div>
    </div>  <!-- ye cards-track ka closing div tag -->

    <!-- Right Button -->
    <button class="carousel-btn next-btn" id="nextBtn">&#10095;</button>
  </div> <!-- ye carousel-wrapper ka closing div tag -->

  <script>
    const track = document.getElementById("cardsTrack");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // Ek click me kitna slide hona chahiye (card width + gap)
    const scrollAmount = 600;

    nextBtn.addEventListener("click", () => {
        track.scrollBy({ left: scrollAmount, behavior: "smooth" });
    });

    prevBtn.addEventListener("click", () => {
        track.scrollBy({ left: -scrollAmount, behavior: "smooth" });
    });
</script>
</section>  <!--trending section ka closing tag-->
</body>
</html>
